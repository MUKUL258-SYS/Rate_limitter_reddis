spring.application.name=distributed-rate-limiter

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5

# Rate limit configuration (overridable via env vars / config server)
rate-limit.default.requests-per-minute=60
rate-limit.default.burst-capacity=20
rate-limit.strict.requests-per-minute=10
rate-limit.api.requests-per-day=10000
rate-limit.sliding-window.requests-per-hour=500

# Actuator - expose health + prometheus metrics
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Logging
logging.level.com.example.ratelimiter=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
